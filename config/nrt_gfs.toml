# Cache lives under each NRT output root, separate from published calendar files.
window_cache_enabled = true
window_cache_max_entries = 32
window_cache_max_bytes = 160000000000
window_cache_max_age_days = 14
lookback_days = 7
maximum_old_replacement_days = 2
# Paired reference/doubled/reference benchmark 4635991 passed: 12.5% less time.
