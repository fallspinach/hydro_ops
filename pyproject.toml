[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydro-ops"
version = "0.1.0"
description = "Meteorological data acquisition and hydrologic modeling workflows"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.scripts]
hydro-ops = "hydro_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
